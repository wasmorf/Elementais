<style>
:root{
  color-scheme: dark;
  --noite:#0e1822; --painel:#16263a; --painel2:#1d3149; --linha:#2d4660;
  --texto:#eef3f6; --suave:#98adbd; --ipe:#f5c02e; --terra:#e07a3c;
  --hp-ok:#5fd068; --hp-meio:#f0c43a; --hp-baixo:#ef5a4a; --exp:#4fb3ff;
  --contorno:#0a1119;
  --display:"Bungee", "Arial Black", system-ui, sans-serif;
  --corpo:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--noite);color:var(--texto);font-family:var(--corpo);font-size:15px;line-height:1.45;padding:14px 16px 28px 16px;
  background-image:radial-gradient(1200px 500px at 80% -10%, #1f3a4f 0%, transparent 60%),radial-gradient(900px 400px at -10% 110%, #2a2419 0%, transparent 60%);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--ipe);outline-offset:2px}
.app{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* Topo */
.topo{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.marca{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.marca h1{font-family:var(--display);font-weight:400;font-size:clamp(22px,4vw,32px);margin:0;letter-spacing:.5px;color:var(--ipe);text-shadow:3px 3px 0 #7a3b12}
.marca span{color:var(--suave);font-size:13px;text-transform:uppercase;letter-spacing:.12em}
.status{display:flex;gap:8px;flex-wrap:wrap}
.pilula{background:var(--painel);border:1px solid var(--linha);border-radius:999px;padding:5px 12px;font-family:var(--mono);font-size:13px;display:flex;gap:6px;align-items:center}
.pilula b{color:var(--ipe)}

/* Blocos */
.bloco{background:var(--painel);border:1px solid var(--linha);border-radius:14px;padding:16px}
.bloco h2{font-family:var(--display);font-weight:400;font-size:17px;margin:0 0 12px;letter-spacing:.3px;color:var(--texto)}
.rotulo{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--suave)}
.grade-hub{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
@media (max-width:760px){.grade-hub{grid-template-columns:1fr}}

.locais{display:flex;flex-direction:column;gap:10px}
.local{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:12px 14px;border-radius:10px;background:var(--painel2)}
.local h3{margin:0;font-size:15px;font-weight:800}
.local p{margin:0;color:var(--suave);font-size:13px;grid-column:1}
.local .acao{grid-row:1 / span 2;grid-column:2}
.btn{background:var(--ipe);color:#2a1a03;border:0;border-radius:10px;padding:9px 14px;font-weight:800;font-size:14px;white-space:nowrap;box-shadow:0 3px 0 #9c6f06}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #9c6f06}
.btn.sec{background:var(--linha);color:var(--texto);box-shadow:0 3px 0 #13202e}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.feito{color:var(--hp-ok);font-weight:800;font-size:13px}

.equipe{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:420px){.equipe{grid-template-columns:1fr}}
.membro{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:center;text-align:left;background:var(--painel2);border:1px solid transparent;border-radius:10px;padding:6px 8px}
.membro:hover{border-color:var(--linha)}
.membro .mini{width:52px;height:52px}
.membro .nm{font-weight:800;font-size:14px;display:flex;justify-content:space-between;gap:6px}
.membro .nv{font-family:var(--mono);font-size:12px;color:var(--suave)}
.membro.lider{border-color:var(--ipe)}
.terminal{display:grid;grid-template-columns:1.45fr 1fr;gap:16px;align-items:start}
@media (max-width:820px){.terminal{grid-template-columns:1fr}}
.cx-topo{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.cx-nome{display:flex;align-items:center;gap:6px}
.cx-nome input{background:var(--painel2);border:1px solid var(--linha);color:var(--texto);border-radius:8px;padding:6px 10px;font:inherit;font-weight:800;width:14ch}
.seta{background:var(--linha);border:0;border-radius:8px;width:34px;height:34px;font-weight:800}
.abas{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.aba{background:var(--painel2);border:1px solid var(--linha);border-radius:6px;padding:3px 8px;font-family:var(--mono);font-size:11.5px;color:var(--suave)}
.aba.on{border-color:var(--ipe);color:var(--ipe)}
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.slot{position:relative;aspect-ratio:1;background:var(--painel2);border:2px solid transparent;border-radius:9px;padding:3px;min-width:0}
.slot:hover{border-color:var(--linha)}
.slot svg{width:100%;height:100%}
.slot .nvmini{position:absolute;right:3px;bottom:2px;font-family:var(--mono);font-size:10px;color:var(--suave);background:rgba(10,17,25,.75);border-radius:4px;padding:0 3px}
.slot.sel{border-color:var(--ipe);background:#2a3b52}
.modo-mover .slot{border-style:dashed;border-color:#6b7f96}
.modo-mover .slot.sel{border-style:solid;border-color:var(--ipe)}
.eq-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.detalhe{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.detalhe .topo-d{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center}
.detalhe .topo-d .mini{width:72px;height:72px;background:var(--painel2);border-radius:10px;padding:4px}
.detalhe h3{margin:0;font-size:16px;font-weight:800}
.detalhe .linha{font-size:13px;color:var(--suave)}
.detalhe .linha b{color:var(--texto);font-weight:600}
.botoes{display:flex;gap:6px;flex-wrap:wrap}
.botoes .btn{padding:7px 11px;font-size:13px}
.dica{font-size:12.5px;color:var(--suave);margin:0}
.rara{color:var(--ipe);font-size:.85em}
.territorios{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.terr{background:var(--painel);border:1px solid var(--linha);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.terr h3{margin:0;font-size:15px;font-weight:800}
.terr p{margin:0;font-size:12.5px;color:var(--suave)}
.terr .fila{display:flex;gap:2px}
.terr .fila .mini{width:36px;height:36px}
.terr .btn{margin-top:auto;align-self:flex-start}
.busca-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.busca-row input,.busca-row select{background:var(--painel2);border:1px solid var(--linha);color:var(--texto);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;min-width:0}
.busca-row input{flex:1 1 160px}
.paginas{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:10px;font-family:var(--mono);font-size:12px;color:var(--suave)}
.caderno{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:start}
@media (max-width:820px){.caderno{grid-template-columns:1fr}}
.progresso{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.progresso .num{font-family:var(--display);font-size:26px;color:var(--ipe);line-height:1}
.progresso .rot{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--suave)}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.entradas{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.entrada{background:var(--painel2);border:2px solid transparent;border-radius:10px;padding:6px 4px 5px;text-align:center;min-width:0}
.entrada:hover:not([disabled]){border-color:var(--linha)}
.entrada.sel{border-color:var(--ipe)}
.entrada[disabled]{cursor:default;opacity:.55}
.entrada .mini{width:58px;height:58px;margin:0 auto}
.entrada .n{font-family:var(--mono);font-size:10.5px;color:var(--suave);display:flex;justify-content:space-between;padding-left:4px;padding-right:4px}
.entrada .nm{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.visto .mini svg{filter:grayscale(1) brightness(.85)}
.registro{display:flex;flex-direction:column;gap:10px}
.registro .arte-g{aspect-ratio:1;max-width:220px;width:100%;margin:0 auto;background:radial-gradient(closest-side,rgba(255,255,255,.08),transparent)}
.registro h3{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.ficha{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ficha div{background:var(--painel2);border-radius:8px;padding:6px 8px}
.ficha b{display:block;font-family:var(--mono);font-size:14px}
.barra-st{display:grid;grid-template-columns:78px 34px 1fr;gap:8px;align-items:center;font-size:12.5px}
.barra-st span:nth-child(2){font-family:var(--mono);text-align:right}
.barra-st i{display:block;height:7px;border-radius:4px;background:var(--exp)}
.cadeia{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cadeia .etapa{display:flex;flex-direction:column;align-items:center;width:78px;text-align:center;font-size:11.5px;font-weight:700}
.cadeia .etapa .mini{width:56px;height:56px}
.cadeia .seta-evo{font-size:10.5px;color:var(--suave);max-width:96px;text-align:center}
.premio{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--painel2)}
.premio small{display:block;color:var(--suave);font-size:12px}
.certificado{border:2px solid var(--ipe);border-radius:12px;padding:14px;text-align:center;background:linear-gradient(135deg,#2a2412,#16263a)}
.certificado h3{font-family:var(--display);font-weight:400;color:var(--ipe);margin:0 0 4px}
.criador{display:grid;grid-template-columns:280px 1fr;gap:18px;align-items:start}
@media (max-width:720px){.criador{grid-template-columns:1fr}}
.avatar-grande{background:radial-gradient(closest-side,#2a4a64,var(--painel2));border-radius:16px;aspect-ratio:5/6;display:grid;place-items:center;padding:10px}
.avatar-grande svg{width:100%;height:100%}
.opcoes{display:flex;flex-direction:column;gap:14px}
.opcoes label.rotulo{display:block;margin-bottom:6px}
.opcoes input[type=text]{background:var(--painel2);border:1px solid var(--linha);color:var(--texto);border-radius:10px;padding:9px 12px;font:inherit;font-size:16px;width:100%;max-width:320px}
.escolhas{display:flex;flex-wrap:wrap;gap:6px}
.esc{background:var(--painel2);border:2px solid var(--linha);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700}
.esc.on{border-color:var(--ipe);color:var(--ipe)}
.cor{width:34px;height:34px;border-radius:50%;border:3px solid var(--linha);padding:0}
.cor.on{border-color:var(--ipe);box-shadow:0 0 0 2px var(--noite) inset}
.pil-av{display:inline-flex;align-items:center;gap:6px;background:var(--painel);border:1px solid var(--linha);border-radius:999px;padding:2px 12px 2px 3px;font-weight:800;font-size:13px}
.pil-av .mini-av{width:28px;height:28px;border-radius:50%;background:var(--painel2);overflow:hidden}
.pil-av .mini-av svg{width:100%;height:100%}
.treinador-av{position:absolute;left:8%;bottom:4%;width:26%;aspect-ratio:5/6;transition:transform .5s ease,opacity .5s ease;z-index:1}
.treinador-av svg{width:100%;height:100%}
.treinador-av.sai{transform:translateX(-120%);opacity:0}
.cartao{max-width:720px;margin:0 auto;background:linear-gradient(135deg,#1f3a4f,#16263a 60%);border:2px solid var(--ipe);border-radius:18px;padding:18px;display:grid;grid-template-columns:200px 1fr;gap:18px}
@media (max-width:600px){.cartao{grid-template-columns:1fr}}
.cartao dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:10px 0 0;font-size:14px}
.cartao dt{color:var(--suave)}
.cartao dd{margin:0;font-weight:700;font-family:var(--mono)}
.insig{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;margin-top:12px}
.insig span{aspect-ratio:1;border-radius:50%;border:2px solid #0a1119;opacity:.2}
.insig span.tem{opacity:1;box-shadow:0 0 6px rgba(255,255,255,.3)}
.centro{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}
@media (max-width:820px){.centro{grid-template-columns:1fr}}
.balcao{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.balcao .av{aspect-ratio:5/6;background:radial-gradient(closest-side,#4a2a3a,var(--painel2));border-radius:14px}
.balcao .av svg{width:100%;height:100%}
.fala{background:#f3f6f8;color:#14202c;border-radius:12px;padding:10px 12px;font-weight:600;position:relative}
.fala::before{content:"";position:absolute;left:-8px;top:18px;border:8px solid transparent;border-right-color:#f3f6f8;border-left:0}
.bandeja{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.bandeja .vaga{width:46px;height:46px;border-radius:50%;background:var(--painel2);border:2px solid var(--linha);display:grid;place-items:center;transition:background .2s,border-color .2s}
.bandeja .vaga svg{width:36px;height:36px}
.bandeja .vaga.acesa{border-color:#ff8ab0;background:#5a2a3e;box-shadow:0 0 12px #ff8ab0}
.brilho-raro{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none}
.brilho-raro span{position:absolute;transform:translate(-50%,-50%) scale(0);color:#ffd23a;font-size:clamp(16px,3.4vw,28px);text-shadow:0 0 2px #6b4a00,0 0 10px #fff3a0,0 0 18px #fff;animation:faisca 1s ease-out forwards}
@keyframes faisca{0%{transform:translate(-50%,-50%) scale(0) rotate(0);opacity:0}35%{transform:translate(-50%,-50%) scale(1.3) rotate(40deg);opacity:1}100%{transform:translate(-50%,-50%) scale(.2) rotate(120deg);opacity:0}}
.menu .op.supremo{background:linear-gradient(90deg,#f5c02e,#ff4458 55%,#3f7bff);color:#fff;border-color:#ffe08a;text-align:center;font-family:var(--display);font-weight:400;letter-spacing:.4px;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.menu .op.supremo-op:not([disabled]){box-shadow:0 0 14px rgba(245,192,46,.45)}
.arena.supremo-fx{animation:supremoFx 1.1s ease}
@keyframes supremoFx{0%{filter:none}20%{filter:brightness(1.8) saturate(1.6)}45%{filter:brightness(1.2) hue-rotate(40deg)}100%{filter:none}}
.marca{align-items:center}
.logo{width:46px;height:46px;flex:none;filter:drop-shadow(0 0 10px rgba(255,68,88,.35)) drop-shadow(0 0 14px rgba(63,123,255,.3));transition:transform .4s ease}
.logo svg{width:100%;height:100%;display:block}
.logo:hover{transform:rotate(-8deg) scale(1.06)}
#marcaBtn{cursor:pointer;border-radius:12px;-webkit-tap-highlight-color:transparent}
#marcaBtn:hover .logo{transform:rotate(-8deg) scale(1.06)}
#marcaBtn:focus-visible{outline:2px solid #8fb4ff;outline-offset:4px}
@media (max-width:600px){.logo{width:38px;height:38px}}
.tt-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin-bottom:14px}
.tt-tipo{border:2px solid rgba(0,0,0,.25);border-radius:10px;padding:8px 4px;color:#fff;font-weight:800;font-size:13px;text-shadow:0 1px 1px rgba(0,0,0,.5);box-shadow:inset 0 0 0 100px rgba(0,0,0,.2);transition:transform .12s}
.tt-tipo.on{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.25),0 0 14px rgba(255,255,255,.35);transform:scale(1.04)}
.tt-titulo{display:flex;align-items:center;gap:8px;margin:12px 0 8px;font-weight:800;font-size:15px}
.tt-titulo .tipo{font-size:13px;padding:4px 10px}
.tt-col{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:640px){.tt-col{grid-template-columns:1fr}}
.tt-caixa{background:rgba(24,39,88,.7);border:1.5px solid;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.tt-cab{display:flex;gap:8px;align-items:center}
.tt-cab b{display:block;font-size:14px}
.tt-cab small{color:var(--suave);font-size:12px}
.tt-ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none;font-size:14px}
.ico{width:1em;height:1em;vertical-align:-.14em;display:inline-block;flex:none}
.brilho-raro span .ico{filter:drop-shadow(0 0 2px #6b4a00) drop-shadow(0 0 6px #fff3a0)}
.tt-ic .ico{width:16px;height:16px}
.seta .ico{width:16px;height:16px;vertical-align:middle}
.mais .ico,.menos .ico{width:.8em;height:.8em;vertical-align:0}
/* tela inicial */
.titulo-tela{max-width:900px;margin:0 auto;padding:24px 0 10px;display:flex;flex-direction:column;align-items:center;text-align:center}
.titulo-logo{width:118px;height:118px;filter:drop-shadow(0 8px 24px rgba(226,38,61,.35))}
.titulo-logo svg{width:100%;height:100%}
.titulo-nome{font-family:var(--display);font-weight:400;font-size:clamp(40px,9vw,72px);margin:6px 0 2px;letter-spacing:.02em;background:linear-gradient(90deg,#ff5a6e,#fff 50%,#6fa0ff);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
@supports not ((-webkit-background-clip:text) or (background-clip:text)){.titulo-nome{color:#fff;-webkit-text-fill-color:#fff}}
.titulo-frase{color:var(--suave);margin:0 0 16px;font-size:15px;max-width:520px}
.titulo-vitrine{display:flex;justify-content:center;flex-wrap:wrap;margin:0 0 18px}
.titulo-vitrine .vit{width:88px;height:88px;margin:0 -4px;animation:flutua 3s ease-in-out infinite}
.titulo-vitrine .vit:nth-child(2n){animation-delay:-1.5s}
.titulo-vitrine .vit svg{width:100%;height:100%}
@keyframes flutua{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.titulo-botoes{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px;margin-bottom:22px}
.btn.grande{padding:14px 18px;font-size:17px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.titulo-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%;margin-bottom:14px;text-align:left}
.tcard{background:var(--painel);border:1px solid var(--linha);border-radius:14px;padding:14px}
.tcard b{display:block;margin:8px 0 4px;font-size:15px}
.tcard p{margin:0;color:var(--suave);font-size:13px;line-height:1.45}
.tic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff}
.tic .ico{width:20px;height:20px}
/* wiki */
.wiki{display:grid;grid-template-columns:250px minmax(0,1fr);gap:12px;align-items:start}
.wiki-nav{position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto;padding:12px}
.wiki-nav input{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:10px;border:1px solid var(--linha);background:var(--painel2);color:inherit;font:inherit;font-size:16px;margin-bottom:8px}
.wiki-sel{display:none;width:100%;box-sizing:border-box;padding:10px;border-radius:10px;border:1px solid var(--linha);background:var(--painel2);color:inherit;font:inherit;font-size:16px}
.wiki-lista .rotulo{display:block;margin:10px 0 4px}
.wiki-link{display:block;width:100%;text-align:left;background:transparent;border:0;color:inherit;font:inherit;font-size:14px;padding:7px 10px;border-radius:8px;cursor:pointer}
.wiki-link:hover{background:var(--painel2)}
.wiki-link.on{background:linear-gradient(90deg,rgba(226,38,61,.28),rgba(63,123,255,.2));font-weight:700}
.wiki-conteudo{padding:16px 18px;line-height:1.6;font-size:15px;min-width:0}
.wiki-conteudo h2{font-family:var(--display);font-weight:400;margin:2px 0 10px;font-size:26px}
.wiki-conteudo ul,.wiki-conteudo ol{padding-left:20px}
.wiki-conteudo li{margin:4px 0}
.wiki-det{border:1px solid var(--linha);border-radius:10px;margin:8px 0;padding:0 10px;background:rgba(255,255,255,.02)}
.wiki-det summary{cursor:pointer;padding:10px 2px;display:flex;align-items:center;gap:8px;list-style:none}
.wiki-det summary::-webkit-details-marker{display:none}
.wiki-det[open] summary{border-bottom:1px solid var(--linha)}
.gl-lista{padding:4px 0 8px}
.gl-item{padding:9px 2px;border-bottom:1px solid var(--linha)}
.gl-item:last-child{border-bottom:0}
.gl-item b{display:block;font-size:14px}
.gl-meta{display:block;font-family:var(--mono);font-size:11.5px;color:var(--azul2,#8fb4ff);margin:2px 0}
.gl-item small{display:block;color:var(--suave);font-size:12.5px;line-height:1.45}
.gdesc{display:block;color:var(--suave);font-size:12px;margin-top:3px}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:#8fb4ff;text-decoration:underline;cursor:pointer}
.wiki-conteudo table{font-size:13px}
.wiki-conteudo th,.wiki-conteudo td{text-align:left!important;vertical-align:middle}
.wiki-ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,#e2263d,#3f7bff)}
.wiki-ic .ico{width:22px;height:22px}
.wiki-item{display:inline-flex;align-items:center;gap:6px}
.wi{width:18px;height:22px;display:inline-block;flex:none}
.wi svg{width:100%;height:100%}
@media (max-width:760px){
  .titulo-cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .titulo-vitrine .vit{width:60px;height:60px}
  .titulo-logo{width:92px;height:92px}
  .wiki{grid-template-columns:minmax(0,1fr)}
  .wiki-nav{position:static;max-height:none}
  .wiki-sel{display:block}
  .wiki-lista{display:none}
  .wiki-conteudo{padding:14px}
}
@media (max-width:380px){.titulo-cards{grid-template-columns:minmax(0,1fr)}}
/* navegadores sem aspect-ratio */
@supports not (aspect-ratio:1/1){
  .arena{height:0;padding-top:62.5%}
  .spr.ini{height:51.2%}
  .spr.jog{height:64%}
  .slot{min-height:56px}
  .registro .arte-g{height:220px}
  .avatar-grande{min-height:220px}
  .treinador-av{height:31%}

}
.link-x{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:8px 14px 8px 8px;border-radius:999px;background:#000;border:1px solid #333a4a;color:#fff;text-decoration:none;font-weight:700;font-size:14px}
.link-x:hover{border-color:#6f7a90}
.x-letra{width:26px;height:26px;border-radius:50%;background:#fff;color:#000;display:inline-flex;align-items:center;justify-content:center;font:900 15px/1 Arial,Helvetica,sans-serif}
.link-x.pequeno{margin-top:0;padding:3px 10px 3px 3px;font-size:12px;vertical-align:middle}
.link-x.pequeno .x-letra{width:20px;height:20px;font-size:12px}
.cp-cod{width:100%;box-sizing:border-box;font-family:var(--mono);font-size:11px;padding:8px;border-radius:10px;border:1px solid var(--linha);background:var(--painel2);color:var(--texto);resize:vertical;word-break:break-all}
.sel-criaturas{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;-webkit-overflow-scrolling:touch}
.sel-cri{display:flex;align-items:center;gap:6px;flex:none;background:var(--painel2);border:2px solid transparent;border-radius:12px;padding:6px 10px 6px 6px;color:inherit;font:inherit;font-size:13px;font-weight:700;cursor:pointer;text-align:left}
.sel-cri.on{border-color:var(--ipe)}
.sel-cri .mini{width:40px;height:40px;display:block}
.sel-cri small{display:block;font-weight:400;color:var(--suave);font-size:11px}
.evo-pop svg{width:100%;height:100%;animation:evoPop .6s ease-out}
@keyframes evoPop{0%{transform:scale(.4);filter:brightness(4)}100%{transform:scale(1);filter:none}}
/* celular: sem zoom de toque duplo e sem pulos */
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a,input,select,textarea,label,.msg,.op,.membro,[role=button]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
input,select,textarea{font-size:16px!important}
.menu{min-height:120px}
html{overflow-anchor:none}
.hall-fila{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.hall-fila .mini{width:56px;height:56px;background:var(--painel2);border-radius:10px;padding:3px}
.hall-fila .mini svg{width:100%;height:100%}
.vazio{border:1px dashed var(--linha);border-radius:10px;min-height:66px;display:grid;place-items:center;color:var(--suave);font-size:12px}
.barra{height:7px;background:#0b141d;border-radius:4px;overflow:hidden;margin-top:4px}
.barra i{display:block;height:100%;width:100%;background:var(--hp-ok);transition:width .5s ease, background-color .3s}
.barra.exp i{background:var(--exp)}

.loja{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center}
.item .ic{width:26px;height:30px}
.item small{color:var(--suave);display:block;font-size:12px}
.preco{font-family:var(--mono);font-size:12px;color:var(--ipe)}
.qtd{font-family:var(--mono);color:var(--suave);font-size:12px}

.tipo{display:inline-block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding:2px 7px;border-radius:5px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.35);white-space:nowrap}
.tipos{display:inline-flex;gap:4px;flex-wrap:wrap}

/* Escolha inicial */
.intro{max-width:62ch}
.intro p{color:var(--suave);margin:.3em 0 0}
.iniciais{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:760px){.iniciais{grid-template-columns:1fr}}
.inicial{background:var(--painel);border:1px solid var(--linha);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.inicial .arte{height:170px;border-radius:10px;display:grid;place-items:center;background:radial-gradient(closest-side, rgba(255,255,255,.08), transparent)}
.inicial .arte svg{width:160px;height:160px}
.inicial h3{font-family:var(--display);font-weight:400;font-size:20px;margin:0}
.inicial p{margin:0;color:var(--suave);font-size:14px}
.linha-evo{font-size:12px;color:var(--suave)}
.linha-evo b{color:var(--texto);font-weight:600}

/* Batalha */
.batalha{max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.arena{position:relative;aspect-ratio:16/10;max-width:100%;border-radius:14px;overflow:hidden;border:3px solid var(--contorno);box-shadow:0 0 0 2px var(--linha)}
.arena[data-bg="trilha"]{background:linear-gradient(#9fd8f0 0%, #e8f3d9 52%, #b9d47a 52%, #97b95a 100%)}
.arena[data-bg="gruta"]{background:linear-gradient(#232a3a 0%, #3b3f52 52%, #5a5146 52%, #43392f 100%)}
.arena[data-bg="arena"]{background:linear-gradient(#f5b35e 0%, #fbe0a8 52%, #cbb48a 52%, #a88f66 100%)}
.arena[data-bg="praia"]{background:linear-gradient(#7fc8f0 0%, #d9f1f7 44%, #3fa6c9 44%, #6cc3d8 56%, #efd9a4 56%, #d9bd82 100%)}
.arena[data-bg="serra"]{background:linear-gradient(#3b2f5c 0%, #8c7bb8 52%, #cfd9e6 52%, #a9b8c9 100%)}
.arena[data-bg="lenda"]{background:radial-gradient(ellipse at 70% 30%, #6a3fa0 0%, #22163a 55%, #120c20 100%)}
.arena[data-bg="ginasio"]{background:linear-gradient(#6d5d57 0%, #a4958a 52%, #8a7a6a 52%, #6b5d50 100%)}
.plat{position:absolute;border-radius:50%;background:radial-gradient(closest-side, rgba(0,0,0,.28), rgba(0,0,0,.12) 70%, transparent)}
.plat.ini{right:6%;top:44%;width:38%;height:12%}
.plat.jog{left:2%;bottom:3%;width:46%;height:13%}
.spr{position:absolute;transition:transform .45s ease, opacity .45s ease, filter .3s}
.spr svg{width:100%;height:100%;overflow:visible;display:block}
.spr.ini{right:9%;top:7%;width:32%;aspect-ratio:1}
.spr.jog{left:5%;bottom:5%;width:40%;aspect-ratio:1}
.spr.jog svg{transform:scaleX(-1)}
.spr.oculto{opacity:0;transform:translateY(12px) scale(.6)}
.spr.caido{opacity:0;transform:translateY(40%)}
.spr.hit{animation:tremer .4s}
.spr.capturando{opacity:0;transform:scale(.1);filter:brightness(3)}
.spr.brilho{filter:brightness(4) saturate(0)}
@keyframes tremer{0%,100%{translate:0}20%{translate:-6px;opacity:.4}40%{translate:6px}60%{translate:-4px;opacity:.4}80%{translate:3px}}
.cristal-voo{position:absolute;right:22%;top:24%;width:7%;aspect-ratio:40/48;display:none}
.cristal-voo.on{display:block}
.cristal-voo.balanca{animation:balanca .55s ease}
@keyframes balanca{0%,100%{rotate:0deg}30%{rotate:-18deg}70%{rotate:14deg}}

.hud{position:absolute;background:rgba(14,24,34,.88);border:2px solid var(--contorno);border-radius:10px;padding:7px 10px;width:min(44%,260px);color:var(--texto)}
.hud.ini{left:4%;top:6%}
.hud.jog{right:4%;bottom:7%}
.hud .l1{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.hud .nome{font-weight:800;font-size:clamp(12px,2.4vw,15px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hud .nv{font-family:var(--mono);font-size:12px;color:var(--ipe)}
.hud .hpnum{font-family:var(--mono);font-size:11.5px;text-align:right;color:var(--suave);margin-top:2px}
.hud .barra{height:8px}
.hud .barra.exp{height:4px;margin-top:3px}
.hud .cap{display:inline-block;width:10px;height:12px;vertical-align:-1px;margin-left:4px}
@media (max-width:460px){.hud{padding:5px 7px}.hud .tipos{display:none}}

.painel{display:grid;grid-template-columns:1.15fr 1fr;gap:10px;min-height:128px}
@media (max-width:600px){.painel{grid-template-columns:1fr}}
.msg{background:#f3f6f8;color:#14202c;border:3px solid var(--contorno);border-radius:12px;padding:12px 14px;font-size:16px;font-weight:600;min-height:92px;position:relative;cursor:pointer;user-select:none}
.msg::after{content:"";position:absolute;right:10px;bottom:8px;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid var(--terra);animation:pisca 1s infinite}
.msg.parado::after{display:none}
@keyframes pisca{50%{opacity:0}}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start}
.menu .op{background:var(--painel2);border:2px solid var(--linha);border-radius:10px;padding:10px 12px;text-align:left;font-weight:800;font-size:15px;min-height:46px}
.menu .op:hover:not([disabled]){border-color:var(--ipe)}
.menu .op[disabled]{opacity:.4;cursor:not-allowed}
.menu .op small{display:flex;justify-content:space-between;gap:6px;font-weight:600;color:var(--suave);font-size:11.5px;margin-top:3px;align-items:center;font-family:var(--mono)}
.menu .op.principal{font-family:var(--display);font-weight:400;font-size:16px;letter-spacing:.3px;text-align:center}
.menu .op.atacar{background:#7a2e1a;border-color:#b24a2a}
.menu .op.equipe{background:#1d4a3a;border-color:#2f7a5d}
.menu .op.mochila{background:#5a4412;border-color:#9a7419}
.menu .op.fugir{background:#2a3a55;border-color:#41608c}
.menu .op.despertar{background:linear-gradient(90deg,#4a2478,#9a2f62);border-color:var(--ipe);color:#fff3c4}
.lenda-card{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:linear-gradient(90deg,#2a1d46,var(--painel2))}
.lenda-card .mini{width:56px;height:56px}
.lenda-card h3{margin:0;font-size:15px;font-weight:800}
.lenda-card p{margin:0;color:var(--suave);font-size:12.5px}
.oculta svg{filter:brightness(0) opacity(.55)}
.menu .op.largo{grid-column:1 / -1}
.menu .op.golpe{border-left-width:2px}
.menu .mini{width:34px;height:34px;float:left;margin-right:8px}

/* Modal */
.veu{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(4,8,12,.7);display:grid;place-items:center;padding:16px;z-index:10;overflow:auto}
.modal{background:var(--painel);border:1px solid var(--linha);border-radius:16px;max-width:620px;width:100%;padding:18px;max-height:calc(100vh - 32px);overflow:auto}
.modal.largo{max-width:900px}
.cab{display:grid;grid-template-columns:130px 1fr;gap:14px;align-items:center}
@media (max-width:460px){.cab{grid-template-columns:90px 1fr}}
.cab .arte{aspect-ratio:1;background:var(--painel2);border-radius:12px;padding:8px}
.cab h3{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.cab .meta{color:var(--suave);font-size:13px;display:flex;flex-direction:column;gap:4px;margin-top:4px}
.cab .meta b{color:var(--texto);font-weight:600}
.tab-wrap{overflow-x:auto;margin-top:14px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--linha);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--suave);font-weight:600}
td.fin{font-family:var(--mono);font-weight:700;color:var(--texto)}
.nota{font-size:11px;padding:1px 6px;border-radius:4px;margin-left:6px;font-weight:800}
.mais{color:#ff9a7a}.menos{color:#7ab8ff}
.golpes-lista{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
@media (max-width:460px){.golpes-lista{grid-template-columns:1fr}}
.golpe-card{background:var(--painel2);border-radius:10px;padding:8px 10px;font-size:13px}
.golpe-card b{display:block;font-size:14px}
.golpe-card span{font-family:var(--mono);color:var(--suave);font-size:11.5px}
.acoes-modal{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}

.tabela-tipos{border-collapse:separate;border-spacing:2px;font-size:11px;width:auto}
.tabela-tipos th,.tabela-tipos td{border:0;padding:0;text-align:center;width:30px;height:26px}
.tabela-tipos td{background:#20344b;border-radius:3px;font-family:var(--mono);font-weight:700}
.tabela-tipos td.x2{background:#2f8f47;color:#fff}
.tabela-tipos td.x05{background:#7a3b2c;color:#ffd2c6}
.tabela-tipos td.x0{background:#0b0f14;color:#9a9a9a}
.tabela-tipos th.v{writing-mode:vertical-rl;transform:rotate(180deg);height:70px;padding:2px}
.tabela-tipos th.h{text-align:right;padding-right:6px;width:auto}

.aviso{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ipe);color:#2a1a03;font-weight:800;padding:10px 16px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.4);z-index:20;max-width:calc(100% - 32px)}
.rodape{color:var(--suave);font-size:12px;text-align:center}
.rodape-links{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 12px;margin:18px 0 6px}
.rodape-links button{background:rgba(255,255,255,.04);border:1px solid var(--linha);color:var(--suave);border-radius:999px;padding:8px 16px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.rodape-links button:hover{color:var(--texto);border-color:#6f7a90}
.rodape-perfil{margin-top:18px}
.rodape-perfil .link-x{margin-top:0}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
/* ================= VISUAL VERMELHO E AZUL ================= */
:root{
  --noite:#070c1f; --painel:rgba(16,26,60,.78); --painel2:#15224b; --linha:#2b3d7a;
  --texto:#f1f4ff; --suave:#a3b2dc; --ipe:#ff4458; --terra:#ff6b5a; --azul:#3f7bff; --azul2:#6fa3ff; --ouro:#ffc94d;
  --exp:#4f9bff;
}
html{background:#070c1f;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:transparent}
body::before{content:"";position:fixed;top:0;right:0;bottom:0;left:0;z-index:-1;pointer-events:none;background:
  radial-gradient(900px 520px at 88% -8%, rgba(63,123,255,.35), transparent 62%),
  radial-gradient(800px 520px at -6% 108%, rgba(255,68,88,.28), transparent 60%),
  radial-gradient(rgba(255,255,255,.045) 1px, transparent 1.2px) 0 0/22px 22px,
  linear-gradient(180deg,#0a1230 0%,#070c1f 100%)}
.app{max-width:1060px}
/* topo */
.topo{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin:-14px -16px 4px;padding:12px 16px;
  background:linear-gradient(180deg,rgba(7,12,31,.92),rgba(7,12,31,.72));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(111,163,255,.18)}
.topo::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--ipe),transparent 35%,transparent 65%,var(--azul))}
.marca h1{background:linear-gradient(95deg,#ff5a6b 0%,#ff8a7a 30%,#8fb4ff 62%,#3f7bff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;
  filter:drop-shadow(0 2px 0 rgba(0,0,0,.45)) drop-shadow(0 0 14px rgba(255,68,88,.25));letter-spacing:.6px}
.marca span{color:var(--azul2)}
.pilula,.pil-av{background:rgba(21,34,75,.85);border:1px solid rgba(111,163,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.pilula b{color:var(--ouro)}
.astro{display:inline-flex;align-items:center;gap:6px;padding:3px 12px 3px 4px}
.astro svg{width:24px;height:24px;display:block}
.astro.dia{background:linear-gradient(90deg,rgba(255,170,60,.25),rgba(21,34,75,.85));border-color:rgba(255,190,90,.5)}
.astro.noite{background:linear-gradient(90deg,rgba(111,163,255,.28),rgba(21,34,75,.85));border-color:rgba(160,190,255,.45)}
.astro .sol{animation:girar 18s linear infinite;transform-origin:50% 50%}
@keyframes girar{to{transform:rotate(360deg)}}
.astro .lua{animation:flutuar 4s ease-in-out infinite}
@keyframes flutuar{50%{transform:translateY(-1.5px)}}
/* blocos e cartões */
.bloco{background:linear-gradient(160deg,rgba(22,36,82,.86),rgba(12,20,48,.9));border:1px solid rgba(111,163,255,.2);border-radius:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06);position:relative;overflow:hidden}
.bloco::before{content:"";position:absolute;top:0;right:0;bottom:auto;left:0;height:3px;background:linear-gradient(90deg,var(--ipe),var(--azul))}
.bloco h2{font-size:18px;display:flex;align-items:center;gap:8px}
.bloco h2::before{content:"";width:10px;height:10px;border-radius:3px;background:linear-gradient(135deg,var(--ipe),var(--azul));transform:rotate(45deg);flex:none}
.local{background:linear-gradient(135deg,rgba(29,46,102,.75),rgba(18,29,66,.75));border:1px solid rgba(111,163,255,.14);border-radius:14px;transition:transform .18s,border-color .18s,box-shadow .18s}
.local:hover{transform:translateY(-2px);border-color:rgba(255,68,88,.45);box-shadow:0 8px 20px rgba(0,0,0,.3)}
.local h3{letter-spacing:.2px}
.terr,.inicial,.lenda-card,.entrada,.membro,.item,.premio,.golpe-card{border-radius:14px}
.terr,.inicial{background:linear-gradient(160deg,rgba(24,39,88,.9),rgba(13,21,50,.92));border:1px solid rgba(111,163,255,.18);box-shadow:0 8px 22px rgba(0,0,0,.3);transition:transform .18s,border-color .18s}
.terr:hover,.inicial:hover{transform:translateY(-2px);border-color:rgba(255,68,88,.45)}
.membro{background:rgba(24,39,88,.8);border:1px solid rgba(111,163,255,.14)}
.membro.lider{border-color:var(--ipe);box-shadow:0 0 0 1px rgba(255,68,88,.35),0 0 18px rgba(255,68,88,.18)}
.entrada{background:rgba(24,39,88,.75);border-color:transparent}
.entrada.sel{border-color:var(--ipe);box-shadow:0 0 14px rgba(255,68,88,.3)}
.lenda-card{background:linear-gradient(90deg,rgba(80,40,120,.55),rgba(24,39,88,.8));border:1px solid rgba(160,120,255,.25)}
/* botões */
.btn{background:linear-gradient(180deg,#ff5d6f,#e2263d);color:#fff;box-shadow:0 3px 0 #8e1323,0 6px 16px rgba(226,38,61,.35);border-radius:12px;letter-spacing:.2px}
.btn:active{box-shadow:0 1px 0 #8e1323}
.btn.sec{background:linear-gradient(180deg,#3f6fe0,#2a4fb3);color:#fff;box-shadow:0 3px 0 #16296b,0 6px 14px rgba(63,123,255,.25)}
.btn.sec:active{box-shadow:0 1px 0 #16296b}
.btn[disabled]{filter:saturate(.3);opacity:.45}
.aba{background:rgba(24,39,88,.8);border-color:rgba(111,163,255,.25);border-radius:999px;padding:4px 11px}
.aba.on{background:linear-gradient(90deg,rgba(255,68,88,.25),rgba(63,123,255,.25));border-color:var(--ipe);color:#fff}
.esc{border-radius:999px;background:rgba(24,39,88,.85)}
.esc.on{border-color:var(--ipe);color:#fff;background:linear-gradient(90deg,rgba(255,68,88,.3),rgba(63,123,255,.3))}
.cor.on{border-color:#fff;box-shadow:0 0 0 3px var(--ipe)}
.preco{color:var(--ouro)}
.rara{color:var(--ouro)}
.feito{color:#6ff0a0}
.barra{background:#070c1f;border:1px solid rgba(111,163,255,.15)}
/* batalha */
.arena{border:2px solid rgba(111,163,255,.35);box-shadow:0 14px 40px rgba(0,0,0,.45),0 0 0 4px rgba(255,68,88,.12)}
.arena.noite::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(180deg,rgba(8,14,48,.72) 0%,rgba(20,24,70,.45) 52%,rgba(8,12,40,.35) 100%);pointer-events:none;z-index:0}
.arena.noite::after{content:"";position:absolute;top:0;right:0;bottom:48%;left:0;pointer-events:none;z-index:0;opacity:.9;
  background:radial-gradient(1.2px 1.2px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 28% 32%,#fff,transparent),radial-gradient(1.4px 1.4px at 45% 12%,#fff,transparent),
  radial-gradient(1px 1px at 58% 28%,#fff,transparent),radial-gradient(1.2px 1.2px at 70% 9%,#fff,transparent),radial-gradient(1px 1px at 82% 34%,#fff,transparent),radial-gradient(1.3px 1.3px at 35% 44%,#fff,transparent),radial-gradient(1px 1px at 92% 20%,#fff,transparent)}
.ceu-astro{position:absolute;left:44%;top:5%;width:11%;aspect-ratio:1;z-index:0;pointer-events:none;filter:drop-shadow(0 0 12px rgba(255,210,120,.7))}
.arena.noite .ceu-astro{filter:drop-shadow(0 0 14px rgba(190,210,255,.8))}
.ceu-astro svg{width:100%;height:100%}
.spr,.plat,.hud,.treinador-av,.cristal-voo{z-index:1}
.arena[data-bg="gruta"] .ceu-astro,.arena[data-bg="ginasio"] .ceu-astro,.arena[data-bg="lenda"] .ceu-astro{display:none}
.arena.noite[data-bg="gruta"]::before,.arena.noite[data-bg="gruta"]::after,.arena.noite[data-bg="ginasio"]::before,.arena.noite[data-bg="ginasio"]::after,.arena.noite[data-bg="lenda"]::before,.arena.noite[data-bg="lenda"]::after{display:none}
.hud{background:linear-gradient(160deg,rgba(14,24,58,.94),rgba(9,15,38,.94));border:1px solid rgba(111,163,255,.35);border-radius:12px;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.hud.ini{border-left:3px solid var(--ipe)}
.hud.jog{border-left:3px solid var(--azul)}
.msg{background:linear-gradient(180deg,#ffffff,#eaf0ff);border:2px solid rgba(63,123,255,.55);border-radius:14px;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.msg::after{color:var(--ipe)}
.menu .op{background:rgba(24,39,88,.9);border:1px solid rgba(111,163,255,.3);border-radius:12px;transition:transform .12s,border-color .12s}
.menu .op:hover:not([disabled]){transform:translateY(-1px);border-color:var(--ipe)}
.menu .op.atacar{background:linear-gradient(180deg,#e2263d,#9c1426);border-color:#ff6b7a}
.menu .op.equipe{background:linear-gradient(180deg,#2f63d8,#1c3c91);border-color:#6fa3ff}
.menu .op.mochila{background:linear-gradient(180deg,#5b3fc4,#35247a);border-color:#9d85ff}
.menu .op.fugir{background:linear-gradient(180deg,#3a4870,#232d4d);border-color:#7485b8}
.modal{background:linear-gradient(160deg,#16244f,#0c1533);border:1px solid rgba(111,163,255,.3);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.veu{background:rgba(3,6,18,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.aviso{background:linear-gradient(90deg,#ff4458,#3f7bff);color:#fff}
.cartao{border:2px solid transparent;background:linear-gradient(160deg,#1a2a5e,#0e1738) padding-box,linear-gradient(135deg,var(--ipe),var(--azul)) border-box}
.rodape{padding-top:8px;padding-bottom:8px}
@media (max-width:600px){.topo{margin:-14px -16px 4px}.marca h1{font-size:22px}}

                document.body.appendChild(a);
                a.click();

}

let WK = { id: "sobre", busca: "" };
function telaWiki(id, voltar) {
    fechar();
    if (id)
        WK.id = id;
    if (voltar)
        WK.voltar = voltar;
    const q = WK.busca.trim().toLowerCase();
    const txt = w => { try {
        return (w.t + " " + w.h().replace(/<[^>]+>/g, " ")).toLowerCase();
    }
    catch (e) {
        return w.t.toLowerCase();
    } };
    const lista = WIKI.filter(w => !q || txt(w).includes(q));
    if (!lista.some(w => w.id === WK.id) && lista.length)
        WK.id = lista[0].id;
    const atual = WIKI.find(w => w.id === WK.id) || WIKI[0];
    const grupos = [...new Set(lista.map(w => w.g))];
    app.innerHTML = (S ? topo() : "") + `<div class="cx-topo"><div style="display:flex;align-items:center;gap:10px"><span class="wiki-ic">${ICO.livro}</span><div><h2 style="font-family:var(--display);font-weight:400;margin:0;font-size:20px">Wiki do Elementais</h2><p class="dica">Tudo sobre os sistemas do jogo.</p></div></div>
    <button class="btn sec" id="wkVoltar">Voltar</button></div>
  <div class="wiki">
    <nav class="wiki-nav bloco">
      <input id="wkBusca" type="search" placeholder="Buscar na wiki" value="${WK.busca.replace(/"/g, "&quot;")}" aria-label="Buscar na wiki">
      <select id="wkSel" class="wiki-sel" aria-label="Escolher assunto">${grupos.map(g => `<optgroup label="${g}">${lista.filter(w => w.g === g).map(w => `<option value="${w.id}" ${w.id === atual.id ? "selected" : ""}>${w.t}</option>`).join("")}</optgroup>`).join("")}</select>
      <div class="wiki-lista">${grupos.map(g => `<span class="rotulo">${g}</span>${lista.filter(w => w.g === g).map(w => `<button class="wiki-link${w.id === atual.id ? " on" : ""}" data-wk="${w.id}">${w.t}</button>`).join("")}`).join("") || `<p class="dica">Nada encontrado.</p>`}</div>
    </nav>
    <article class="wiki-conteudo bloco"><span class="rotulo">${atual.g}</span><h2>${atual.t}</h2>${atual.h()}</article>
  </div>`;
    $("#wkVoltar").onclick = () => { (WK.voltar || (S ? telaHub : telaTitulo))(); };
    app.querySelectorAll("[data-wk]").forEach(b => b.onclick = () => { telaWiki(b.dataset.wk); if (window.innerWidth < 760) {
        const a = document.querySelector(".wiki-conteudo");
        if (a)
            a.scrollIntoView({ behavior: "smooth" });
    } });
    $("#wkSel").onchange = ev => telaWiki(ev.target.value);
    $("#wkBusca").oninput = ev => { WK.busca = ev.target.value; const pos = ev.target.selectionStart; telaWiki(); const b = $("#wkBusca"); b.focus(); try {
        b.setSelectionRange(pos, pos);
    }
    catch (e) { } };
    const bt = app.querySelector("[data-wiki-tipos]");
    if (bt)
        bt.onclick = tabelaTipos;
    app.querySelectorAll("[data-wk-ir]").forEach(b => b.onclick = () => { WK.busca = ""; telaWiki(b.dataset.wkIr); window.scrollTo(0, 0); });
}

    <button class="btn sec" id="trVoltar">Voltar ao mapa</button></div>
  <div class="territorios">${CHAVES_T.map(k => {

      <div class="fila">${es.slice(0, 6).map(e => `<div class="mini ${S.vistos[e] ? "" : "oculta"}">${ESP[e].arte()}</div>`).join("")}</div>
      <button class="btn${lib ? "" : " sec"}" data-t="${k}" ${lib ? "" : "disabled"}>${lib ? "Explorar" : "Libera com Nv " + (L.niveis[0] - 5)}</button></div>`;
    }).join("")}</div>`;
    $("#trVoltar").onclick = telaHub;
    app.querySelectorAll("[data-t]").forEach(b => b.onclick = () => encontroSelvagem(b.dataset.t));
